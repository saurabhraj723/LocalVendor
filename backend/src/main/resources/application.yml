spring:
  application:
    name: localflow-backend
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${LOCALFLOW_DB_URL:jdbc:postgresql://localhost:5432/localflow}
    username: ${LOCALFLOW_DB_USERNAME:localflow}
    password: ${LOCALFLOW_DB_PASSWORD:localflow_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

localflow:
  cors:
    allowed-origins: ${LOCALFLOW_CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
  security:
    jwt:
      secret: ${LOCALFLOW_JWT_SECRET:localflow-dev-secret-change-me-local-only-32chars}
  password-reset:
    frontend-base-url: ${LOCALFLOW_FRONTEND_URL:http://localhost:4173}
    from: ${LOCALFLOW_PASSWORD_RESET_FROM:${SPRING_MAIL_USERNAME:}}
    dev-link-enabled: ${LOCALFLOW_PASSWORD_RESET_DEV_LINK_ENABLED:false}
